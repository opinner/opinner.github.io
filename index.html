<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

		<title>Climate Study Circle</title>

		<link rel="stylesheet" href="dist/reset.css">
		<link rel="stylesheet" href="dist/reveal.css">
		<link rel="stylesheet" href="dist/theme/solarized.css">

		<!-- Theme used for syntax highlighted code -->
		<link rel="stylesheet" href="plugin/highlight/monokai.css">
	</head>
	<body>
		<div class="reveal">
			<div class="slides">
				<section data-markdown="slides.md"
						 data-separator="^^\r?\n---\r?\n$" 
						 data-separator-notes="^Note:"
						 data-charset="utf-8"
						 data-transition="slide">
				</section>
			</div>
		</div>
		<script src="https://cdn.jsdelivr.net/gh/ncase/nutshell@1.0.7/nutshell.js"></script> 
		<script>
			Nutshell.setOptions({
				startOnLoad: false, // Start Nutshell on load? (default: true)
				lang: 'en', // Language (default: 'en', which is English)
				dontEmbedHeadings: false, // If 'true', removes the "embed this as a nutshell" option on headings
			});
		</script>
		<script src="dist/reveal.js"></script>
		<script src="plugin/notes/notes.js"></script>
		<script src="plugin/markdown/markdown.js"></script>
		<script src="plugin/highlight/highlight.js"></script>
		<script src="plugin/math/math.js"></script>
		<script>
			Reveal.initialize({
				hash: true,
				// Learn about plugins: https://revealjs.com/plugins/
				plugins: [ RevealMarkdown, RevealHighlight, RevealNotes, RevealMath.KaTeX ],
				// Activate the scroll view
				view: 'scroll',
				// Force the scrollbar to remain visible
				scrollProgress: true,
			});
		</script>
		<script>
			Reveal.on('ready', () => {
				Nutshell.start();
			});
		</script>
	</body>
</html>
