<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

		<title>Climate Study Circle</title>

		<link rel="stylesheet" href="dist/reset.css">
		<link rel="stylesheet" href="dist/reveal.css">
		<link rel="stylesheet" href="dist/theme/solarized.css">

		<!-- Theme used for syntax highlighted code -->
		<link rel="stylesheet" href="plugin/highlight/monokai.css">
		<style>
		.reveal {
			font-size: 30px; /* Controls the base font size for slide content */
		}
		.reveal h1 {
			font-size: 4em; /* Customize headers separately if needed */
		}
		.reveal h2 {
			font-size: 2.2em;
		}
		.reveal h3 {
			font-size: 1.7em;
		}
		</style>
	</head>
	<body>
		<div class="reveal">
			<div class="slides">
				<section data-markdown="slides.md"
						 data-separator="^^\r?\n---\r?\n$" 
						 data-separator-notes="^Note:"
						 data-charset="utf-8"
						 data-transition="slide">
				</section>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/gh/ncase/nutshell@1.0.7/nutshell.js"></script> 
		<script>
			Nutshell.setOptions({
				startOnLoad: false, // Start Nutshell on load? (default: true)
				lang: 'en', // Language (default: 'en', which is English)
				dontEmbedHeadings: true, // If 'true', removes the "embed this as a nutshell" option on headings
			});
		</script>
		<style>
			.nutshell-expandable{
        		color: #657b83, /* HACK: Somehow also the nutshell links turned blue. Here I try to force them to have the text color */
		}
		</style>
		<style>
			.nutshell-bubble{
				max-height: '95%'; /* I dont know if this does anything. I tried to keep the bubbles from extending out of the view */
			}
		</style>

		<script src="dist/reveal.js"></script>
		<script src="plugin/notes/notes.js"></script>
		<script src="plugin/markdown/markdown.js"></script>
		<script src="plugin/highlight/highlight.js"></script>
		<script src="plugin/math/math.js"></script>
		<script>
			Reveal.initialize({
				hash: true,
				// Learn about plugins: https://revealjs.com/plugins/
				plugins: [ RevealMarkdown, RevealHighlight, RevealNotes, RevealMath.KaTeX ],
				// Activate the scroll view
				view: 'scroll',
				// Force the scrollbar to remain visible
				scrollProgress: true,
				center: true, // default value, but important for correct display of nutshell bubbles 
			    width: '70%',
    			height: '90%'
			});
		</script>
		<script>
			Reveal.on('ready', () => {
				Nutshell.start(Reveal.getRevealElement());
			});
		</script>
	</body>
</html>
